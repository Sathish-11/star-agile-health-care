---
- name: Install Java, Maven, and Docker on Kubernetes nodes
  hosts: k8s_nodes
  become: yes
  tasks:
    
    - name: Update and Upgrade apt packages
      apt: 
        update_cache: yes
        upgrade: dist

    - name: Ensure required base packages are installed
      apt:
        name:
          - ca-certificates
          - curl
          - gnupg
          - lsb-release
        state: present
        update_cache: yes

    - name: Install Java and Maven
      apt:
        name:
          - openjdk-17-jdk    # Use 11 or 17 depending on your app needs
          - maven
        state: present

    - name: Create Docker keyrings directory
      file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'

    - name: Add Docker's official GPG key
      get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: '0644'

    - name: Add Docker apt repository
      apt_repository:
        repo: "deb [arch={{ ansible_architecture }} signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu {{ ansible_facts['distribution_release'] | lower }} stable"
        state: present
        filename: docker

    - name: Update apt cache after adding Docker repo
      apt:
        update_cache: yes

    - name: Ensure containerd is installed
      apt:
        name: containerd
        state: present
        update_cache: yes

    - name: Ensure containerd service is running and enabled
      systemd:
        name: containerd
        state: started
        enabled: yes

    - name: Install Docker package from Ubuntu repository
      apt:
        name: docker.io
        state: present
        update_cache: yes
      
    - name: Ensure Docker service is running and enabled
      systemd:
        name: docker
        state: started
        enabled: yes
    - name: Add Devops user to the docker group
      user:
        name: devops
        groups: docker
        append: yes
