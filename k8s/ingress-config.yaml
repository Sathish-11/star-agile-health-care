# Ingress Resources for Local Domains
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: medicu-dev-ingress
  namespace: dev
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  rules:
  - host: dev.local.medicu.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: medicu-dev-service
            port:
              number: 80

